<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rolograph forms</title>
  </head>
  <body>
    <form name="join-interest" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="join-interest" />
      <input type="text" name="name" />
      <input type="text" name="email" />
      <select name="role">
        <option>AI Product Engineer</option>
        <option>Graph Systems Builder</option>
        <option>Motion / UI Killer</option>
        <option>Event Operator</option>
        <option>Tell me where I fit</option>
      </select>
      <textarea name="message"></textarea>
      <input type="text" name="signal" />
      <input name="bot-field" />
    </form>
  </body>
</html>
